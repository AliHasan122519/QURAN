name: Build iOS app

# Builds the iPhone app on a macOS runner.
#  - without the Apple secrets: only checks that the project compiles (unsigned build) — nothing is published.
#  - with the Apple secrets (see IOS_PUBLISH.md): signs the app and uploads it to App Store Connect (TestFlight / App Store review).
# It is started by hand (Actions > Build iOS app > Run workflow); the Android build and the content updates are not affected by it.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to App Store Connect (needs the Apple secrets)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/validate_content.mjs

      - name: Build number (minutes since 1970, always higher than the previous upload)
        run: echo "BUILD_NO=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Xcode in use (the runner's newest; App Store uploads need a recent Xcode/iOS SDK)
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: Build the web app and sync it into the iOS project
        env:
          VITE_CONTENT_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/content/
        run: npm run build:ios

      - name: Compile check (unsigned)
        if: ${{ !inputs.upload }}
        run: |
          xcodebuild archive -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ env.BUILD_NO }} | tail -30
          test -d build/App.xcarchive/Products/Applications/App.app && echo "OK: the iOS app compiles"

      - name: Sign and upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::The secret $v is not set. See IOS_PUBLISH.md."; exit 1; fi
          done
          mkdir -p ~/private_keys build
          echo "$ASC_KEY_P8_BASE64" | base64 -d > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8 -authenticationKeyID ${ASC_KEY_ID} -authenticationKeyIssuerID ${ASC_ISSUER_ID}"
          xcodebuild archive -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM=${APPLE_TEAM_ID} CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ env.BUILD_NO }} $AUTH
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath build/export $AUTH
