name: Publish library site
# the standalone site of the library (only «كتب علم التعبير» and «كتب الفراسة والشخصيات»), published on GitHub Pages.
# Manual (Run workflow), and automatic when the books or the site change. Needs: Settings > Pages > Source = «GitHub Actions».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['content/kutubtabir.json', 'content/kutubfiras.json', 'content/books/**', 'content/covers/**', 'library.html', 'src/LibrarySite.tsx', 'src/library-main.tsx', 'src/components/Library*.tsx', 'src/components/Book*.tsx', 'src/styles.css', 'scripts/build_library_site.mjs']
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: library-pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/build_library_site.mjs
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-library }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
