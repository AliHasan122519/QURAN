name: Build Android APK

# A new APK is built when the app's CODE changes. Changes to the CONTENT (content/**) do not need a new APK:
# installed apps download them by themselves the next time they are opened.
on:
  push:
    branches: [main]
    paths-ignore: ['content/**', 'mcp-server/**', '**.md']
  schedule:
    - cron: '0 3 * * 1'        # weekly: refresh the content bundled inside the APK for fresh installs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/validate_content.mjs

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # the hosted ubuntu runner already has the Android SDK (ANDROID_HOME) with licences accepted
      - run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - uses: gradle/actions/setup-gradle@v4

      - name: Use the signing key from repository secrets (if set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/ci.jks
            echo "KEYSTORE_FILE=keystore/ci.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Signing with the repository key."
          else
            echo "No KEYSTORE_BASE64 secret: signing with the committed development key."
          fi

      - name: Build the web app and sync it into the Android project
        env:
          VITE_CONTENT_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/content/
          VITE_APK_VERSION: ${{ github.run_number }}
        run: npm run build:android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease -PappVersionCode=${{ github.run_number }} --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/alboheth-quran.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with: { name: alboheth-quran-apk, path: out/alboheth-quran.apk }

      - name: Publish the APK as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest out/alboheth-quran.apk --title "تطبيق الباحث القرآني (APK)" --notes "أحدث نسخة من التطبيق. رقم البناء ${{ github.run_number }}. التحديثات على المحتوى تصل إلى التطبيق المثبَّت تلقائياً دون إعادة تنزيل."

      - name: Tell installed apps that a new APK exists
        if: github.ref == 'refs/heads/main'
        run: |
          node scripts/set_apk.mjs ${{ github.run_number }} "https://github.com/${{ github.repository }}/releases/download/apk-latest/alboheth-quran.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/manifest.json
          git diff --cached --quiet || (git commit -m "chore: announce APK build ${{ github.run_number }} [skip ci]" && git pull --rebase origin main && git push origin HEAD:main)
