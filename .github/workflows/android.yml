name: Build Android APK

# A new APK is built when the app's CODE changes. Changes to the CONTENT (content/**) do not need a new APK:
# installed apps download them by themselves the next time they are opened.
on:
  push:
    branches: [main]
    paths-ignore: ['content/**', 'mcp-server/**', '**.md']
  schedule:
    - cron: '0 3 * * 1'        # weekly: refresh the content bundled inside the APK for fresh installs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/validate_content.mjs

      # The update path must never break: a build that cannot update installed apps is not published.
      - name: Test the update path (content update + «update available» dialog)
        run: |
          npm i -g playwright@1.49.1 >/dev/null
          playwright install --with-deps chromium >/dev/null
          NODE_PATH=$(npm root -g) node tests/update.mjs
          node tests/content_cli.mjs
          node mcp-server/test.mjs

      # versionCode = minutes since 1970: always higher than the previous build (even if the repository or the run counter is ever recreated)
      - name: Version number of this build
        run: echo "APP_VC=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # the hosted ubuntu runner already has the Android SDK (ANDROID_HOME) with licences accepted
      - run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - uses: gradle/actions/setup-gradle@v4

      - name: Use the signing key from repository secrets (if set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/ci.jks
            echo "KEYSTORE_FILE=keystore/ci.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Signing with the repository key."
          else
            echo "No KEYSTORE_BASE64 secret: signing with the committed development key."
          fi

      - name: Build the web app and sync it into the Android project
        env:
          VITE_CONTENT_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/content/
          VITE_APK_VERSION: ${{ env.APP_VC }}
        run: npm run build:android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease -PappVersionCode=${{ env.APP_VC }} --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/alboheth-quran.apk
          ls -la out

      # An APK signed with a DIFFERENT key cannot be installed over the apps already installed. Stop before publishing one.
      - name: Check the signing key is the one the installed apps have
        run: |
          FP=$(keytool -printcert -jarfile out/alboheth-quran.apk 2>/dev/null | grep -m1 'SHA256:' | awk '{print $2}')
          EXP=$(tr -d '[:space:]' < android/keystore/signer.sha256)
          echo "built with:  $FP"; echo "installed apps: $EXP"
          if [ "$FP" != "$EXP" ]; then echo "::error::The signing key changed. Installed apps would refuse this update. If you changed the key on purpose, update android/keystore/signer.sha256 (every user must then uninstall and reinstall once)."; exit 1; fi

      - uses: actions/upload-artifact@v4
        with: { name: alboheth-quran-apk, path: out/alboheth-quran.apk }

      - name: Publish the APK as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest out/alboheth-quran.apk --title "تطبيق الباحث القرآني (APK)" --notes "أحدث نسخة من التطبيق. رقم الإصدار ${{ env.APP_VC }}. التحديثات على المحتوى تصل إلى التطبيق المثبَّت تلقائياً دون إعادة تنزيل."

      - name: Tell installed apps that a new APK exists
        if: github.ref == 'refs/heads/main'
        run: |
          node scripts/set_apk.mjs ${{ env.APP_VC }} "https://github.com/${{ github.repository }}/releases/download/apk-latest/alboheth-quran.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/manifest.json
          git diff --cached --quiet || (git commit -m "chore: announce APK build ${{ env.APP_VC }} [skip ci]" && git pull --rebase origin main && git push origin HEAD:main)
