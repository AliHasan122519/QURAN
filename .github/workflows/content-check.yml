name: Check content

# Runs on every change of content/ (including the ones made through the MCP server) and on the MCP server's own code.
on:
  push:
    paths: ['content/**', 'mcp-server/**', 'scripts/**', 'tests/content_cli.mjs']
  pull_request:
    paths: ['content/**', 'mcp-server/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/validate_content.mjs
      - run: node mcp-server/test.mjs
      - run: node tests/content_cli.mjs
